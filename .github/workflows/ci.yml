name: CI

on:
  push:
  pull_request:

jobs:
  build-app:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Stage bundled uv runtime
        run: scripts/stage_uv_runtime.sh

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project magic-voice.xcodeproj \
            -scheme magic-voice \
            -configuration Debug \
            -derivedDataPath "${RUNNER_TEMP}/magicvoice-derived-data" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            REQUIRE_BUNDLED_UV=YES

      - name: Verify packaged app resources
        run: scripts/verify_app_resources.sh "${RUNNER_TEMP}/magicvoice-derived-data/Build/Products/Debug/Magic Voice.app"

      - name: Run tests
        run: |
          xcodebuild \
            -project magic-voice.xcodeproj \
            -scheme magic-voice \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO

  check-sidecar:
    name: Sidecar syntax & dependency check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock

      - name: Install sidecar dependencies
        run: uv sync --project sidecar

      - name: Syntax check sidecar.py
        run: uv run --project sidecar python -m py_compile sidecar/sidecar.py

      # NOTE: scripts/smoke_sidecar.py requires a live sidecar process that
      # lazily downloads a ~1 GB Nemotron ASR model on first use
      # (BOOT_TIMEOUT=300s). It is intentionally excluded from CI to avoid
      # multi-GB model downloads on every push. Run it locally with a real
      # audio fixture when modifying the sidecar protocol.
